<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campus Club Profiles</title>
<style>
  :root {
    --ink: #12263f; --ink-soft: #4a5b70; --paper: #f3f5f8; --card: #ffffff;
    --line: #d5dce5; --accent: #0e7c66; --accent-dark: #0a5c4b;
    --edit: #9a6b00; --danger: #b42318; --radius: 6px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #e8eef6; --ink-soft: #a3b2c4; --paper: #0e1722; --card: #16222f;
      --line: #2a3a4c; --accent: #3ec3a4; --accent-dark: #6fd9c0;
      --edit: #e0b040; --danger: #ff8a7d;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink);
    font: 16px/1.5 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; }
  header { padding: 2rem clamp(1rem, 4vw, 3rem) 1.25rem;
    border-bottom: 4px solid var(--accent); background: var(--card); }
  header h1 { margin: 0; font: 700 clamp(1.8rem, 4vw, 2.6rem)/1.1 Georgia, "Times New Roman", serif; }
  header p { margin: .4rem 0 0; color: var(--ink-soft); max-width: 60ch; }
  main { display: grid; grid-template-columns: minmax(280px, 340px) 1fr; gap: 1.5rem;
    padding: 1.5rem clamp(1rem, 4vw, 3rem) 3rem; align-items: start; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
  .panel { background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 1.25rem; }
  form.panel { position: sticky; top: 1rem; }
  @media (max-width: 860px) { form.panel { position: static; } }
  h2 { margin: 0 0 1rem; font: 700 1.2rem/1.2 Georgia, serif; }
  form.editing { border-color: var(--edit); box-shadow: 0 0 0 2px var(--edit); }
  label { display: block; font-weight: 600; font-size: .9rem; margin: .8rem 0 .25rem; }
  input, select, textarea { width: 100%; padding: .55rem .65rem; border: 1px solid var(--line);
    border-radius: var(--radius); background: var(--paper); color: var(--ink); font: inherit; }
  textarea { min-height: 4.5rem; resize: vertical; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: .75rem; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .actions { display: flex; gap: .6rem; margin-top: 1.2rem; }
  button { font: inherit; font-weight: 600; cursor: pointer; padding: .55rem 1rem;
    border-radius: var(--radius); border: 1px solid var(--accent); background: var(--accent); color: #fff; }
  @media (prefers-color-scheme: dark) { .actions button:first-child { color: #07251d; } }
  button:hover { background: var(--accent-dark); border-color: var(--accent-dark); }
  button.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
  button.ghost:hover { background: var(--paper); }
  button.small { padding: .25rem .6rem; font-size: .85rem; }
  button.edit { background: transparent; color: var(--edit); border-color: var(--edit); }
  button.edit:hover { background: var(--edit); color: #fff; }
  button.del { background: transparent; color: var(--danger); border-color: var(--danger); }
  button.del:hover { background: var(--danger); color: #fff; }
  .toolbar { display: flex; justify-content: space-between; align-items: center;
    gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem; }
  .toolbar h2 { margin: 0; }
  .toolbar input { max-width: 260px; }
  .count { color: var(--ink-soft); font-weight: 400; font-size: .95rem; font-family: inherit; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 640px; }
  th, td { text-align: left; padding: .65rem .6rem; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: .85rem; color: var(--ink-soft); font-weight: 600; white-space: nowrap; }
  td.name strong { display: block; }
  td.name span { color: var(--ink-soft); font-size: .88rem; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr.flash { animation: flash 1.2s ease-out; }
  @keyframes flash { from { background: color-mix(in srgb, var(--accent) 25%, transparent); } to { background: transparent; } }
  @media (prefers-reduced-motion: reduce) { tr.flash { animation: none; } }
  .empty { padding: 2rem 0; text-align: center; color: var(--ink-soft); }
  #toast { position: fixed; right: 1rem; bottom: 1rem; max-width: 22rem; padding: .75rem 1rem;
    border-radius: var(--radius); background: var(--ink); color: var(--paper); font-weight: 600;
    opacity: 0; transform: translateY(8px); pointer-events: none; transition: opacity .2s, transform .2s; }
  #toast.show { opacity: 1; transform: none; }
  #toast.error { background: var(--danger); color: #fff; }
</style>
</head>
<body>
<header>
  <h1>Campus Club Profiles</h1>
  <p>Add, update and remove the clubs on campus. Every change is saved to the database through the REST API.</p>
</header>

<main>
  <form id="club-form" class="panel" novalidate>
    <h2 id="form-title">Add a club</h2>
    <input type="hidden" id="club-id">

    <label for="name">Club name *</label>
    <input id="name" maxlength="120" required placeholder="e.g. Mulungushi Computing Society">

    <div class="row">
      <div>
        <label for="category">Category</label>
        <select id="category">
          <option>General</option><option>Academic</option><option>Arts</option>
          <option>Business</option><option>Community</option><option>Faith</option>
          <option>Sports</option><option>Technology</option>
        </select>
      </div>
      <div>
        <label for="meeting_day">Meets on</label>
        <select id="meeting_day">
          <option value="">Not set</option>
          <option>Monday</option><option>Tuesday</option><option>Wednesday</option>
          <option>Thursday</option><option>Friday</option><option>Saturday</option><option>Sunday</option>
        </select>
      </div>
    </div>

    <label for="description">Description</label>
    <textarea id="description" placeholder="What does the club do?"></textarea>

    <label for="president">President</label>
    <input id="president" maxlength="100">

    <div class="row">
      <div>
        <label for="contact_email">Contact email</label>
        <input id="contact_email" type="email" maxlength="120">
      </div>
      <div>
        <label for="member_count">Members</label>
        <input id="member_count" type="number" min="0" step="1" value="0">
      </div>
    </div>

    <div class="actions">
      <button type="submit" id="save-btn">Add club</button>
      <button type="button" class="ghost" id="cancel-btn" hidden>Cancel edit</button>
    </div>
  </form>

  <section class="panel" aria-labelledby="list-title">
    <div class="toolbar">
      <h2 id="list-title">All clubs <span class="count" id="count"></span></h2>
      <input id="search" type="search" placeholder="Search clubs" aria-label="Search clubs">
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>Club</th><th>Category</th><th>President</th><th>Meets</th><th>Members</th><th>Actions</th></tr>
        </thead>
        <tbody id="club-rows"></tbody>
      </table>
      <div id="empty" class="empty" hidden>No clubs yet. Add the first one using the form.</div>
    </div>
  </section>
</main>

<div id="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
